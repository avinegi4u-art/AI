apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marsool

resources:
  - ../../base

# Image tags are set by the deployment pipeline to an immutable digest; `latest` in the base
# exists only so the manifests are readable on their own.
images:
  - name: ghcr.io/marsool/auth
    newTag: latest
  - name: ghcr.io/marsool/user
    newTag: latest
  - name: ghcr.io/marsool/merchant
    newTag: latest
  - name: ghcr.io/marsool/catalog
    newTag: latest
  - name: ghcr.io/marsool/gateway
    newTag: latest
  - name: ghcr.io/marsool/migrate
    newTag: latest
