# Brings every schema to head before any service starts, so a service never boots against a
# schema it does not expect. Applied as a pre-sync hook by the deployment pipeline.
apiVersion: batch/v1
kind: Job
metadata:
  name: marsool-migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: marsool
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # Cleaned up automatically, but kept long enough for a failed run's logs to be read.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/marsool/migrate:latest
          command: ["python", "scripts/migrate_all.py"]
          envFrom:
            - configMapRef:
                name: marsool-config
            - secretRef:
                name: marsool-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
