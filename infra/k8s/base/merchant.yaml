apiVersion: apps/v1
kind: Deployment
metadata:
  name: marsool-merchant
  labels:
    app.kubernetes.io/name: merchant
    app.kubernetes.io/part-of: marsool
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: merchant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: merchant
        app.kubernetes.io/part-of: marsool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across zones so a zone failure degrades rather than removes a service.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: merchant
      containers:
        - name: merchant
          image: ghcr.io/marsool/merchant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: MARSOOL_PORT
              value: "8003"
          envFrom:
            - configMapRef:
                name: marsool-config
            - secretRef:
                name: marsool-secrets
          # Liveness checks only that the process is alive. Using a dependency-aware check here
          # would restart every pod at once during a brief database blip.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # Readiness checks the database and Redis, so an unhealthy pod leaves the load
          # balancer instead of being killed.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              # Memory is limited so a leak kills a pod rather than a node. CPU is deliberately
              # unlimited: throttling presents as an unexplained latency regression.
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: marsool-merchant
  labels:
    app.kubernetes.io/name: merchant
    app.kubernetes.io/part-of: marsool
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: merchant
  ports:
    - name: http
      port: 8003
      targetPort: http
