# Shape only. Real values are injected by the External Secrets Operator from the cluster's
# secrets manager; this file exists so the required keys are discoverable and is never applied.
apiVersion: v1
kind: Secret
metadata:
  name: marsool-secrets
  labels:
    app.kubernetes.io/part-of: marsool
type: Opaque
stringData:
  MARSOOL_DATABASE_DSN: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/marsool"
  MARSOOL_REDIS_DSN: "redis://:PASSWORD@HOST:6379/0"
  # RS256 key pair. The private key is mounted only into the auth service; every other
  # service receives the public key alone, so a compromised service cannot mint tokens.
  MARSOOL_JWT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
  MARSOOL_JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----"
