apiVersion: apps/v1
kind: Deployment
metadata:
  name: marsool-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: marsool
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: marsool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      containers:
        - name: gateway
          image: ghcr.io/marsool/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MARSOOL_PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: marsool-config
            - secretRef:
                name: marsool-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          # The gateway's readiness depends only on Redis: it holds no database. A downstream
          # service being unavailable must not remove the gateway from rotation, or a single
          # failing service would take the whole API offline instead of returning 503 for its
          # own routes.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: marsool-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: marsool
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marsool-gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: marsool
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    # Coarse edge limit as a backstop. Real per-identity limiting happens in the gateway,
    # which can key by user rather than by IP.
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.marsool.ae]
      secretName: marsool-api-tls
  rules:
    - host: api.marsool.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marsool-gateway
                port:
                  name: http
