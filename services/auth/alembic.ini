[alembic]
script_location = migrations
prepend_sys_path = src
# Revision IDs are assigned explicitly (`--rev-id 0002_auth`) rather than generated as
# random hashes, so a service's migration order is readable from the file listing.
file_template = %%(rev)s_%%(slug)s
# The database URL comes from MARSOOL_DATABASE_DSN via the service settings; see
# migrations/env.py. It is intentionally absent here so that no environment's
# credentials can be committed to the repository.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
