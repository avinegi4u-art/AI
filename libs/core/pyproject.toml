[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marsool-core"
version = "0.1.0"
description = "Shared platform library for Marsool services: config, logging, errors, auth, db, events."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "structlog>=24.4",
    "pyjwt>=2.9",
    "redis>=5.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marsool_core = ["py.typed"]
