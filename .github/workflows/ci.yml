name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests run against real PostgreSQL/PostGIS and Redis. The behaviour that matters most —
  # distance ranking, polygon containment, timezone-aware opening hours, atomic rate limiting,
  # FOR UPDATE SKIP LOCKED outbox claims — is datastore behaviour, and a stub would only verify
  # the stub. See docs/architecture/08-testing.md.
  MARSOOL_ENVIRONMENT: test
  MARSOOL_LOG_LEVEL: WARNING
  MARSOOL_LOG_FORMAT: console
  MARSOOL_DATABASE_DSN: postgresql+asyncpg://marsool:marsool@localhost:5432/marsool_test
  MARSOOL_REDIS_DSN: redis://localhost:6379/15
  MARSOOL_JWT_SECRET: marsool-test-secret-key-0123456789abcdef
  MARSOOL_EVENT_BUS_BACKEND: memory

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/core -e services/auth -e services/user \
                      -e services/merchant -e services/catalog -e api-gateway
          pip install ruff mypy pytest pytest-asyncio pyyaml
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy libs/core/src services/*/src api-gateway/src
      - name: Verify committed OpenAPI documents are current
        run: python scripts/export_openapi.py --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: marsool
          POSTGRES_PASSWORD: marsool
          POSTGRES_DB: marsool_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marsool -d marsool_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/core -e services/auth -e services/user \
                      -e services/merchant -e services/catalog -e api-gateway
          pip install pytest pytest-asyncio pytest-cov
      - name: Run the suite
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: marsool
          POSTGRES_PASSWORD: marsool
          POSTGRES_DB: marsool
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marsool -d marsool"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARSOOL_ENVIRONMENT: local
      MARSOOL_DATABASE_DSN: postgresql+asyncpg://marsool:marsool@localhost:5432/marsool
      MARSOOL_REDIS_DSN: redis://localhost:6379/0
      MARSOOL_AUTH_SERVICE_URL: http://127.0.0.1:8001
      MARSOOL_USER_SERVICE_URL: http://127.0.0.1:8002
      MARSOOL_MERCHANT_SERVICE_URL: http://127.0.0.1:8003
      MARSOOL_CATALOG_SERVICE_URL: http://127.0.0.1:8004
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/core -e services/auth -e services/user \
                      -e services/merchant -e services/catalog -e api-gateway
          pip install "uvicorn[standard]"
      - name: Migrate and seed
        run: |
          python scripts/migrate_all.py
          python scripts/seed_local.py
      - name: Start services
        run: |
          for spec in "marsool_auth.main:app 8001" "marsool_user.main:app 8002" \
                      "marsool_merchant.main:app 8003" "marsool_catalog.main:app 8004" \
                      "marsool_gateway.main:app 8000"; do
            set -- $spec
            MARSOOL_PORT="$2" uvicorn "$1" --host 127.0.0.1 --port "$2" --no-access-log &
          done
          # Wait for readiness rather than sleeping a fixed interval.
          for port in 8000 8001 8002 8003 8004; do
            for _ in $(seq 30); do
              curl -fsS "http://127.0.0.1:$port/health/ready" >/dev/null && break
              sleep 1
            done
          done
      - name: Smoke test
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000

  images:
    name: Build container images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth, path: services/auth, module: "marsool_auth.main:app", port: 8001 }
          - { service: user, path: services/user, module: "marsool_user.main:app", port: 8002 }
          - { service: merchant, path: services/merchant, module: "marsool_merchant.main:app", port: 8003 }
          - { service: catalog, path: services/catalog, module: "marsool_catalog.main:app", port: 8004 }
          - { service: gateway, path: api-gateway, module: "marsool_gateway.main:app", port: 8000 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/service.Dockerfile
          push: false
          build-args: |
            SERVICE_PATH=${{ matrix.path }}
            SERVICE_MODULE=${{ matrix.module }}
            SERVICE_PORT=${{ matrix.port }}
          tags: marsool/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
