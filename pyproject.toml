[project]
name = "marsool-monorepo"
version = "0.1.0"
description = "Marsool — food & grocery delivery platform (monorepo dev tooling)"
requires-python = ">=3.11"

# This file exists only to configure repo-wide tooling (ruff, mypy, pytest).
# Runtime dependencies live in libs/*/pyproject.toml and services/*/pyproject.toml.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "web", "mobile"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # bandit (security)
    "T20",  # no print
    "BLE",  # no bare/blind except
    "PLC0415",  # imports must be at module top level
    "RUF",
]
ignore = [
    "B008",  # FastAPI uses function calls (Depends/Query) in argument defaults
    "S104",  # binding to 0.0.0.0 is intentional inside containers
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]  # asserts and dummy secrets are fine in tests
"**/migrations/**" = ["E501", "I001"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = [
    "marsool_core",
    "marsool_auth",
    "marsool_user",
    "marsool_merchant",
    "marsool_catalog",
    "marsool_gateway",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "libs/core/src:services/auth/src:services/user/src:services/merchant/src:services/catalog/src:api-gateway/src"
exclude = ["/migrations/", "/\\.venv/", "^web/", "^mobile/"]

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "aiokafka.*", "shapely.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "libs/core/tests",
    "services/auth/tests",
    "services/user/tests",
    "services/merchant/tests",
    "services/catalog/tests",
    "api-gateway/tests",
]
# importlib import mode lets every service keep conventional test module names
# (test_service.py, test_router.py) without cross-service basename collisions.
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: exercises real Postgres/PostGIS/Redis dependencies",
    "contract: validates cross-service API/event contracts",
]
filterwarnings = ["error::DeprecationWarning:marsool_.*"]

[tool.coverage.run]
branch = true
source = ["marsool_core", "marsool_auth", "marsool_user", "marsool_merchant", "marsool_catalog", "marsool_gateway"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
